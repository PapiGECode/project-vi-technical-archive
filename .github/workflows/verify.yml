name: Community sandbox verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify manifest and map profile
        run: npm test

      - name: Configure C++20 sandbox
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build sandbox
        run: cmake --build build --config Release --parallel

      - name: Run simulation smoke test
        run: ./build/pvi_sandbox
